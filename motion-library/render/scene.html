<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub motion sample scene</title>
<link rel="stylesheet" href="../runtime/hub-motion-base.css">
<style>
  /* Sample scene built only from catalog entries that have browser evidence.
     System fonts only: no font, image, audio or third-party asset is bundled. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
  body { color: #f8fafc; font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", "DejaVu Sans", sans-serif; }
  .layer { position: absolute; inset: 0; }
  .backdrop { background: radial-gradient(circle at 30% 35%, #1e3a8a 0%, #0b1220 62%); }
  .card { display: flex; flex-direction: column; justify-content: center; gap: 2.5vh; padding: 0 9vw; }
  .kicker { font-size: 2.6vh; letter-spacing: 0.08em; color: #93c5fd; }
  h1 { margin: 0; font-size: 8.5vh; line-height: 1.15; font-weight: 700; }
  .arabic { margin: 0; font-size: 6.4vh; line-height: 1.5; min-height: 1.5em; }
  .metric { display: flex; align-items: baseline; gap: 1.6vw; font-size: 3.2vh; color: #cbd5e1; }
  .metric strong { font-size: 7vh; color: #f8fafc; font-variant-numeric: tabular-nums; }
  .dot { width: 2.2vh; height: 2.2vh; border-radius: 50%; background: #34d399; align-self: center; }
  .closing { background: #0b1220; align-items: center; text-align: center; }
  .closing p { margin: 0; font-size: 5vh; line-height: 1.5; }
  .closing small { font-size: 2.8vh; color: #93c5fd; }
</style>
</head>
<body>
<div class="layer backdrop" id="backdrop"></div>
<div class="layer card" id="opening">
  <div class="kicker" data-text id="kicker">GLOBAL AI ENGINEERING HUB</div>
  <h1 data-text id="headline">Shared digital motion</h1>
  <p class="arabic" data-text id="arabic" dir="rtl" lang="ar"></p>
  <div class="metric" id="metric"><span class="dot" id="dot"></span><strong id="count">0</strong><span data-text id="label">motions verified in a real browser</span></div>
</div>
<div class="layer card closing" id="closing">
  <p data-text dir="rtl" lang="ar" id="closing-ar">حركة واحدة، تُعرَّف مرة وتُتحقَّق في كل مشروع</p>
  <small data-text id="closing-en">One specification. Verified wherever it runs.</small>
</div>
<script type="module">
  import * as hub from '../runtime/hub-motion.mjs';

  const load = async (id) => (await fetch(`../specs/${id}.json`)).json();
  const [dolly, slideUp, inlineStart, pulse, dissolve, focus] = await Promise.all(
    ['cinema-dolly-in', 'ui-slide-up', 'slide-inline-start', 'legacy-10', 'cross-dissolve', 'cinema-rack-focus'].map(load),
  );
  const $ = (id) => document.getElementById(id);
  const arabicLine = 'مكتبة الحركات الرقمية المشتركة';
  const verified = Number(new URLSearchParams(location.search).get('verified') || 28);
  const options = { reducedMotion: false };

  // Every animation is created once with its start time as a delay, then only ever seeked.
  const animations = [
    hub.play($('backdrop'), dolly, options),
    ...hub.stagger([$('kicker'), $('headline')], slideUp, { each: 120, delay: 200, ...options }),
    hub.play($('metric'), inlineStart, { delay: 1500, ...options }),
    hub.play($('dot'), pulse, { delay: 2000, ...options }),
    hub.play($('closing'), dissolve, { delay: 2700, ...options }),
    hub.play($('closing-ar'), focus, { delay: 2700, ...options }),
  ];
  const between = (time, start, length) => Math.min(1, Math.max(0, (time - start) / length));

  window.scene = {
    duration: 4200,
    palette: { text: '#f8fafc', accent: '#93c5fd', background: ['#0b1220', '#1e3a8a'] },
    effects: [dolly, slideUp, inlineStart, pulse, dissolve, focus].map((spec) => spec.id).concat(['ui-staggered-list', 'typography-typewriter', 'typography-counter-interpolation']),
    seek(time) {
      hub.seek(animations, time);
      hub.renderTypewriter($('arabic'), arabicLine, between(time, 600, 1100), 'ar', 'word');
      hub.renderCounter($('count'), 0, verified, between(time, 1600, 800));
    },
  };
  window.scene.seek(0);
</script>
</body>
</html>
