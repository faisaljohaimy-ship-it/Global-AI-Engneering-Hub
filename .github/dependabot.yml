version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: []
  - package-ecosystem: npm
    directories:
      - /motion-library/verify
      - /motion-library/chromium-stack
      - /motion-library/quality
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      browser-driver-candidates:
        patterns:
          - playwright
          - playwright-core
