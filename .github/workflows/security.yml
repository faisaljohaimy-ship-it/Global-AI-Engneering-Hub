name: Security audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-source:
    name: Tracked secrets and Python execution hazards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Verify scanner with malicious and safe fixtures
        run: python3 -m unittest discover -s tests -p test_security_scan.py -v
      - name: Scan all tracked index text and Python AST
        run: python3 scripts/security_scan.py scan
