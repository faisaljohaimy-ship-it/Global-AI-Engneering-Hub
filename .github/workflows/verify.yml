name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 hub.py audit
      - run: python3 motion-library/compile.py motion-library/specs/fade-in.json --output /tmp/fade-in.css
      - run: test -s /tmp/fade-in.css
      - run: python3 motion-library/springs.py
      - run: python3 motion-library/catalog_status.py
      - run: node --test motion-library/runtime/hub-motion.test.mjs
      - run: node tests/test_motion_runtime.mjs
      - run: node tests/test_motion_performance.mjs
      - run: node --test tests/test_render_options.mjs

  motion-browser:
    name: motion in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the locked browser verifier
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          set -euo pipefail
          npm ci --prefix motion-library/verify --ignore-scripts --no-audit --no-fund
          motion-library/verify/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Play every implemented specification in Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: node motion-library/verify/browser.mjs
      - name: Exercise all Motion Lab controls
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: node tests/test_motion_lab_browser.mjs
      - name: Render and inspect the bounded cinematic sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: node motion-library/render/render.mjs --out "$RUNNER_TEMP/hub-motion-render"
