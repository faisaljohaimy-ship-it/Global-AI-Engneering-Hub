name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 hub.py audit
      - run: python3 motion-library/compile.py motion-library/specs/fade-in.json --output /tmp/fade-in.css
      - run: test -s /tmp/fade-in.css
      - run: python3 motion-library/springs.py
      - run: python3 motion-library/catalog_status.py
      - run: node --test motion-library/runtime/hub-motion.test.mjs

  motion-browser:
    name: motion in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the browser tool outside the repository
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw-tools/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Play every specification in Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          NODE_PATH: ${{ runner.temp }}/pw-tools/node_modules
        run: node motion-library/verify/browser.mjs
