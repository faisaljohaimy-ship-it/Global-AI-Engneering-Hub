name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 hub.py audit
      - run: python3 motion-library/compile.py motion-library/specs/fade-in.json --output /tmp/fade-in.css
      - run: test -s /tmp/fade-in.css
