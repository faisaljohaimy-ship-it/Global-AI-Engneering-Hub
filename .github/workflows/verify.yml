name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 hub.py audit
      - run: python3 motion-library/compile.py motion-library/specs/fade-in.json --output /tmp/fade-in.css
      - run: test -s /tmp/fade-in.css
      - run: node tests/test_motion_runtime.mjs
      - run: node tests/test_motion_performance.mjs
