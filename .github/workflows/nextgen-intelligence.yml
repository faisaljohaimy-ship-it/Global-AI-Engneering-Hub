name: Next generation intelligence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nextgen-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-runtime:
    name: Original camera motions in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare local runtime and evidence paths
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/nextgen-browsers\nNEXTGEN_CAMERA_RECEIPT=%s/nextgen-evidence/camera-chromium.json\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check original mechanisms and existing SDK compatibility
        run: node --test tests/test_nextgen_camera.mjs tests/test_universal_motion_sdk.mjs
      - name: Install the existing reviewed exact browser lock
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix motion-library/chromium-stack
          motion-library/chromium-stack/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Require fresh real renders in desktop and mobile viewports
        run: node tests/test_nextgen_camera_browser.mjs
      - name: Re-render one native engine motion per engine family against its recorded signature
        env:
          MOTION_PLAYWRIGHT_PACKAGE: ${{ github.workspace }}/motion-library/chromium-stack
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/test_native_motions_browser.mjs | tee "$RUNNER_TEMP/native-motions-browser.tap"
          # node --test exits 0 when this test skips for want of Playwright; here a skip is a failure.
          grep -qx '# skipped 0' "$RUNNER_TEMP/native-motions-browser.tap"
      - name: Prove every digital show scene in Chromium
        env:
          MOTION_PLAYWRIGHT_PACKAGE: ${{ github.workspace }}/motion-library/chromium-stack
        run: |
          set -euo pipefail
          node tests/test_digital_show_scenes.mjs | tee "$RUNNER_TEMP/digital-show-scenes.json"
          # The script prints status "skipped" and exits 0 without Playwright; here only "passed" counts.
          node --input-type=module -e "import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';assert.equal(JSON.parse(readFileSync(process.argv[1],'utf8').trim().split('\n').at(-1)).status,'passed')" "$RUNNER_TEMP/digital-show-scenes.json"
      - name: Preserve this run's source-bound proof without promoting registry claims
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextgen-camera-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextgen-evidence/
          if-no-files-found: warn
          retention-days: 7
