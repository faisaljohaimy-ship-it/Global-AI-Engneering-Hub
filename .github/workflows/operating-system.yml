name: operating-system

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operating-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: operating system and motion unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Run the complete Python suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify the 400 recipes, universal SDK and Chromium input boundaries
        run: |
          set -euo pipefail
          node --test tests/test_motion_expansion.mjs tests/test_universal_motion_sdk.mjs tests/test_chromium_stack_options.mjs tests/test_ported_motions.mjs
      - name: Verify the native engine motions, their registry and orchestrator without a browser
        run: |
          set -euo pipefail
          node --test tests/test_native_motions_digital.mjs packages/motion-engines/test/core.test.mjs packages/motion-engines/test/orchestrator.test.mjs packages/motion-engines/test/registry.test.mjs packages/motion-engines/test/purpose.test.mjs

  chromium:
    name: fresh Chromium and Motion Studio runtime evidence
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Allocate fresh private evidence outside the checkout
        run: |
          set -euo pipefail
          umask 077
          evidence_root="$(mktemp -d /tmp/hub-operating-system.XXXXXXXX)"
          {
            printf 'OS_EVIDENCE_ROOT=%s\n' "$evidence_root"
            printf 'OS_EVIDENCE_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'CHROMIUM_EVIDENCE_DIR=%s/chromium\n' "$evidence_root"
            printf 'MOTION_EVIDENCE_DIR=%s/motion-studio\n' "$evidence_root"
            printf 'MOTION_STUDIO_EVIDENCE=%s/motion-studio\n' "$evidence_root"
            printf 'MOTION_PLAYWRIGHT_PACKAGE=%s/motion-library/chromium-stack\n' "$GITHUB_WORKSPACE"
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s/operating-system-playwright\n' "$RUNNER_TEMP"
            printf 'MOTION_BROWSER=chromium\n'
          } >> "$GITHUB_ENV"
      - name: Install only the lockfile-reviewed Chromium verifier
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix motion-library/chromium-stack
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const require=createRequire(`${process.env.MOTION_PLAYWRIGHT_PACKAGE}/package.json`);
          const policy=JSON.parse(readFileSync('catalog/capabilities/playwright.json','utf8'));
          const row=JSON.parse(readFileSync('catalog/registry.json','utf8')).find(row=>row.id==='microsoft/playwright');
          assert.equal(row.status,'approved');assert.equal(row.revision,policy.revision);
          for (const field of ['license_review','security_review','commercial_review']) assert.equal(row[field],'approved');
          assert.match(policy.revision,/^[a-f0-9]{40}$/);assert.match(policy.version,/^\d+\.\d+\.\d+$/);
          assert(['APPROVED','INSTALLED','OPERATIONAL','TESTED','PROJECT_VERIFIED'].includes(policy.requested_state));
          for (const scope of ['chromium-stack','verify','quality']) {
            const packagePath=`motion-library/${scope}`;
            assert.equal(JSON.parse(readFileSync(`${packagePath}/package.json`,'utf8')).devDependencies.playwright,policy.version);
            const lock=JSON.parse(readFileSync(`${packagePath}/package-lock.json`,'utf8'));
            for (const name of ['playwright','playwright-core']) {
              assert.match(policy.npm_integrities[name],/^sha512-[A-Za-z0-9+/]{86}==$/);
              assert.equal(lock.packages[`node_modules/${name}`].version,policy.version);
              assert.equal(lock.packages[`node_modules/${name}`].integrity,policy.npm_integrities[name]);
            }
          }
          assert.equal(require('playwright/package.json').version,policy.version);
          JS
          motion-library/chromium-stack/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Exercise native runtime, RTL, reduced motion and failing performance budgets
        run: |
          set -euo pipefail
          node tests/test_chromium_stack_runtime.mjs
          # A bounded CI lab budget is not a production FPS or GPU claim.
          node motion-library/chromium-stack/smoke.mjs --frames 30 --frame-budget-ms 20 --out "$CHROMIUM_EVIDENCE_DIR" > "$OS_EVIDENCE_ROOT/chromium-console.json"
      - name: Render every Motion Studio recipe in desktop and mobile Chromium
        run: node tests/test_motion_studio_browser.mjs
      - name: Measure real Studio Lighthouse and axe budgets
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix motion-library/quality
          quality_chrome="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell -print -quit)"
          test -n "$quality_chrome" && test -x "$quality_chrome"
          export QUALITY_AUDIT_CHROME="$quality_chrome"
          export QUALITY_AUDIT_EVIDENCE="$OS_EVIDENCE_ROOT/quality-fixtures"
          node --test tests/test_quality_audit.mjs tests/test_quality_audit_browser.mjs
          node motion-library/quality/audit.mjs --root "$GITHUB_WORKSPACE" --chrome "$quality_chrome" --profile desktop --out "$OS_EVIDENCE_ROOT/quality-desktop"
          node motion-library/quality/audit.mjs --root "$GITHUB_WORKSPACE" --chrome "$quality_chrome" --profile mobile --out "$OS_EVIDENCE_ROOT/quality-mobile"
      - name: Require new source-bound receipts from this run
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path

          checkout = Path.cwd().resolve()
          root = Path(os.environ['OS_EVIDENCE_ROOT']).resolve(strict=True)
          assert root.parent == Path('/tmp') and root.name.startswith('hub-operating-system.')
          assert root.stat().st_mode & 0o077 == 0, 'Evidence must remain private on the runner'
          start = dt.datetime.fromisoformat(os.environ['OS_EVIDENCE_STARTED_AT'].replace('Z', '+00:00'))
          now = dt.datetime.now(dt.timezone.utc)

          def receipt(directory, filename):
              path = Path(directory) / filename
              assert not path.is_symlink() and path.resolve(strict=True).is_relative_to(root)
              assert not path.resolve().is_relative_to(checkout), 'Tracked evidence is not runtime proof'
              assert path.stat().st_mtime >= start.timestamp(), 'Receipt predates this run'
              value = json.loads(path.read_text())
              at = dt.datetime.fromisoformat(value['recorded_at_utc'].replace('Z', '+00:00'))
              assert start <= at <= now and (now - at).total_seconds() <= 3600, 'Stale or future receipt'
              assert value['schema_version'] == 1 and value['status'] == 'passed'
              return value

          def hashes(base, actual, expected):
              assert set(actual) == set(expected), 'Incomplete source binding'
              for name, digest in actual.items():
                  assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest, name

          native = receipt(os.environ['CHROMIUM_EVIDENCE_DIR'], 'report.json')
          studio = receipt(os.environ['MOTION_EVIDENCE_DIR'], 'motion-studio-runtime.json')
          hashes(checkout / 'motion-library/chromium-stack', native['inputs'], [
              'package.json', 'package-lock.json', 'options.mjs', 'native-probes.mjs', 'smoke.mjs', 'harness.html'])
          hashes(checkout, studio['source_sha256'], [
              'packages/motion-sdk/index.mjs', 'motion-studio/index.html', 'motion-studio/studio.mjs',
              'motion-studio/styles.css', 'motion-library/expansion/catalog.mjs',
              'motion-library/expansion/definitions.json', 'motion-library/expansion/families.mjs',
              'motion-library/expansion/systems.mjs', 'motion-library/expansion/geometry.mjs',
              'tests/test_motion_studio_browser.mjs'])
          policy = json.loads((checkout / 'catalog/capabilities/playwright.json').read_text())
          assert native['toolchain']['playwright'] == studio['playwright_version'] == policy['version']
          assert native['browser']['engine'] == 'chromium' and studio['engine'] == 'chromium-canvas2d'
          assert native['browser']['version'] == studio['browser']
          assert native['functional_status'] == native['performance_budget']['status'] == 'passed'
          assert native['functional_rendering_cases'] == len(native['cases']) == 3
          assert native['webgpu_rendering_cases'] == 0 and native['network']['external_requests'] == 0
          assert all(row['status'] == 'passed' and row['page_errors'] == row['external_requests'] == 0
                     and all(row['checks'].values()) for row in native['cases'])
          assert studio['new_definitions_rendered'] == 400 and studio['viewport_profiles'] == 2
          assert studio['frame_samples'] == 2400 and studio['reduced_motion_cases'] == 800
          assert studio['production_fps_verified'] is False and studio['gpu_runtime_verified'] is False
          assert len(studio['results']) == 2
          for viewport in studio['results']:
              rows = viewport['results']
              assert len(rows) == len({row['id'] for row in rows}) == 400
              assert viewport['errors'] == [] and viewport['rendered_definitions'] == 400
              assert all(len(row['frames']) == 3 and all(frame['changed_pixels'] > 0 for frame in row['frames']) for row in rows)
              assert len(viewport['reduced_motion']) == 400 and all(row['stable'] for row in viewport['reduced_motion'])
          print('Fresh source-bound evidence: 3 native cases; 400 recipes x 2 viewports; 2400 frames; 800 reduced-motion cases.')
          PY
      - name: Preserve bounded runtime receipts as CI artifacts
        if: ${{ always() && env.OS_EVIDENCE_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operating-system-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OS_EVIDENCE_ROOT }}/
          if-no-files-found: warn
          retention-days: 7
